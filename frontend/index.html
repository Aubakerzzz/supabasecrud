<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management System - CRUD with Supabase & MSSQL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>
                    <span class="icon">📦</span>
                    Product Management System
                </h1>
                <p>Full CRUD Operations | Supabase API | MSSQL Database</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Form Section -->
            <div class="card form-card">
                <div class="card-header">
                    <h2 id="formTitle">➕ Add New Product</h2>
                </div>
                <div class="card-body">
                    <form id="productForm">
                        <input type="hidden" id="productId">
                        
                        <div class="form-group">
                            <label for="name">Product Name *</label>
                            <input type="text" id="name" required placeholder="Enter product name">
                        </div>

                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category">
                                <option value="">Select Category</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Accessories">Accessories</option>
                                <option value="Storage">Storage</option>
                                <option value="Cables & Adapters">Cables & Adapters</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" rows="3" placeholder="Enter product description"></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="price">Price ($) *</label>
                                <input type="number" id="price" step="0.01" required placeholder="0.00">
                            </div>

                            <div class="form-group">
                                <label for="quantity">Quantity *</label>
                                <input type="number" id="quantity" required placeholder="0">
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <span class="btn-icon">💾</span>
                                Save Product
                            </button>
                            <button type="button" class="btn btn-secondary" id="cancelBtn">
                                <span class="btn-icon">❌</span>
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Search Section -->
            <div class="card search-card">
                <div class="card-body">
                    <div class="search-container">
                        <input type="text" id="searchInput" placeholder="🔍 Search products by name, description or category...">
                        <button id="searchBtn" class="btn btn-search">Search</button>
                        <button id="clearSearchBtn" class="btn btn-clear">Clear</button>
                    </div>
                </div>
            </div>

            <!-- Products List Section -->
            <div class="card products-card">
                <div class="card-header">
                    <h2>📋 Products List</h2>
                    <span id="productCount" class="badge">0 products</span>
                </div>
                <div class="card-body">
                    <div id="loadingSpinner" class="spinner hidden"></div>
                    <div id="productsList" class="products-grid">
                        <!-- Products will be displayed here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚠️ Confirm Delete</h3>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this product?</p>
                <p class="text-warning">This action cannot be undone!</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                <button class="btn btn-secondary" id="cancelDeleteBtn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
